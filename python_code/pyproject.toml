[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-multiplex"
version = "1.0.0"
description = "Multiplex temporal community detection with customizable interlayer coupling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jared Edgerton", email = "jared.edgerton@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["community detection", "multiplex networks", "temporal networks", "louvain", "leiden"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
