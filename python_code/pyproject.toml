[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-multiplex"
version = "1.1.0"
description = "Multiplex temporal community detection with customizable interlayer coupling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jared Edgerton", email = "jared.edgerton@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["community detection", "multiplex networks", "temporal networks", "louvain", "leiden"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.0",
  "scipy>=1.7"
]

[project.urls]
Homepage = "https://github.com/jfedgerton/dynamic_multiplex"
Repository = "https://github.com/jfedgerton/dynamic_multiplex"
Issues = "https://github.com/jfedgerton/dynamic_multiplex/issues"

[project.optional-dependencies]
louvain = ["python-louvain>=0.16"]
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
